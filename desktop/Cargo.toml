[package]
name = "horizon-studio-desktop"
version = "0.7.0"
description = "Native desktop shell for Horizon Studio"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "horizon-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["custom-protocol"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
