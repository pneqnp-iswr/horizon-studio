name: Windows EXE / versioned Release

# Every VERSION change on master must end in a verified GitHub release with a working
# Windows executable (docs/RELEASING.md). All gates run on the same commit (github.sha)
# that is built and tagged; only the final job can write to the repository.
on:
  push:
    branches: [master]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-studio-release
  cancel-in-progress: false

jobs:
  guard:
    name: Release source and metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Only master may release
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases are built only from refs/heads/master, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: VERSION, release notes and documents agree
        id: meta
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/check_release_metadata.py
          python scripts/release.py check-notes --version "$version" --notes RELEASE_NOTES.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tests:
    name: Python, Node and browser E2E gates
    needs: guard
    uses: ./.github/workflows/tests.yml

  official:
    name: Official Horizon checker gate
    needs: guard
    uses: ./.github/workflows/official-content-check.yml

  desktop:
    name: Desktop app (installer, portable ZIP, manifest)
    needs: guard
    uses: ./.github/workflows/desktop.yml
    with:
      release: true

  build:
    name: Build and smoke-test the Windows executable
    needs: [guard, tests, official]
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 pillow==11.3.0
      - name: Generate original app icon
        run: python scripts/make_icon.py
      - name: Build standalone Windows executable
        run: python scripts/build_windows.py

      - name: Frozen smoke test, first launch
        shell: pwsh
        run: |
          $exe = "dist/HorizonStudio-$env:VERSION-Windows-x64.exe"
          if (!(Test-Path $exe)) { throw "Missing executable $exe" }
          $report = Join-Path $env:RUNNER_TEMP 'smoke-1.json'
          $workspace = Join-Path $env:RUNNER_TEMP 'smoke-workspace'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test','--smoke-report',$report,'--smoke-workspace',$workspace -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Frozen smoke test failed with exit code $($p.ExitCode)" }

      - name: Frozen smoke test, relaunch keeps the disk workspace
        shell: pwsh
        run: |
          $exe = "dist/HorizonStudio-$env:VERSION-Windows-x64.exe"
          $report = Join-Path $env:RUNNER_TEMP 'smoke-2.json'
          $workspace = Join-Path $env:RUNNER_TEMP 'smoke-workspace'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test','--smoke-report',$report,'--smoke-workspace',$workspace -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Second launch failed with exit code $($p.ExitCode)" }
          $result = Get-Content $report | ConvertFrom-Json
          if ($result.version -ne $env:VERSION) { throw "Executable reports version $($result.version)" }
          if ($result.checks.workspace_before_launch -ne 'recovered') { throw 'The workspace written by the first launch was not recovered' }

      - name: Normal GUI launch serves the editor
        shell: pwsh
        run: |
          $exe = "dist/HorizonStudio-$env:VERSION-Windows-x64.exe"
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8787/' -TimeoutSec 5
              $ok = ($r.StatusCode -eq 200) -and ($r.Content -match 'Horizon Studio')
            } catch {}
          }
          # The one-file bootloader starts a child process: stop the whole tree.
          taskkill /PID $p.Id /T /F | Out-Null
          if (-not $ok) { throw 'The GUI launch did not serve the editor on 127.0.0.1:8787 within 60 s' }

      - name: Build manifest and checksums from this build
        shell: bash
        run: |
          exe="HorizonStudio-$VERSION-Windows-x64.exe"
          python scripts/release.py manifest --version "$VERSION" --exe "dist/$exe" \
            --commit "$GITHUB_SHA" --tag "v$VERSION" \
            --gate "tests=${{ needs.tests.result }}" --gate "official-check=${{ needs.official.result }}" \
            --gate "frozen-smoke=success" --gate "frozen-relaunch=success" --gate "gui-launch=success" \
            --smoke-report "$RUNNER_TEMP/smoke-2.json" --out dist/build-manifest.json
          python scripts/release.py checksums --dist dist "$exe" build-manifest.json

      - name: Keep the tested build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build
          path: |
            dist/HorizonStudio-${{ env.VERSION }}-Windows-x64.exe
            dist/build-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish and verify the GitHub release
    needs: [guard, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download this run's tested build
        uses: actions/download-artifact@v4
        with:
          name: windows-release-build
          path: build-exe
      - name: Download this run's tested desktop build
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-release-build
          path: build-desktop
      - name: One set of assets, one SHA256SUMS.txt
        run: |
          mkdir dist
          exe="HorizonStudio-$VERSION-Windows-x64.exe"
          setup="HorizonStudio-$VERSION-Windows-x64-setup.exe"
          zip="HorizonStudio-$VERSION-Windows-x64-portable.zip"
          cp "build-exe/$exe" build-exe/build-manifest.json "build-desktop/$setup" "build-desktop/$zip" build-desktop/desktop-manifest.json dist/
          python scripts/desktop_release.py verify --dist build-desktop --manifest build-desktop/desktop-manifest.json
          python scripts/release.py checksums --dist dist "$exe" build-manifest.json "$setup" "$zip" desktop-manifest.json
      - name: Publish (draft, upload, verify, then publish; never replaces assets)
        run: python scripts/release.py publish --repo "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$GITHUB_SHA" --dist dist --notes RELEASE_NOTES.md --desktop
      - name: Independent verification through the GitHub API
        run: python scripts/release.py verify --repo "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$GITHUB_SHA"
