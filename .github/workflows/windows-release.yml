name: Windows EXE / versioned Release

on:
  push:
    branches: [master]
    paths:
      - VERSION
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizon-studio-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, smoke test, publish
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION must be x.y.z' }
          "number=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Run all unit, HTTP and packaging tests
        run: python -m unittest discover -s tests -v

      - name: Install frozen-build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 pillow==11.3.0

      - name: Generate original app icon
        run: python scripts/make_icon.py

      - name: Build standalone Windows executable
        run: python scripts/build_windows.py

      - name: Run executable smoke test
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.number }}'
          $exe = Join-Path (Get-Location) "dist/HorizonStudio-$version-Windows-x64.exe"
          if (!(Test-Path $exe)) { throw "Missing executable $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen executable smoke test failed: $($process.ExitCode)" }

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.number }}'
          $file = "HorizonStudio-$version-Windows-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path dist $file)).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Preserve test-built binary as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorizonStudio-${{ steps.version.outputs.number }}-Windows-x64
          path: |
            dist/HorizonStudio-${{ steps.version.outputs.number }}-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub prerelease (skip existing tags)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.number }}'
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping versioned downloads unchanged."
            exit 0
          }
          $exe = "dist/HorizonStudio-$version-Windows-x64.exe"
          gh release create $tag $exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Horizon Studio $tag — Windows" --notes-file RELEASE_NOTES.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Failed publishing $tag" }
