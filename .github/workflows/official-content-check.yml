name: Official Horizon content-mod check

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/official-content-check.yml'
      - 'horizon_compat/**'
      - 'studio_core/**'
      - 'horizon_cli.py'
      - 'studio.py'
      - 'source_workbench.py'
      - 'voxel_architect.py'
      - 'examples/**'
      - 'tests/fixtures/migration/**'
      - 'scripts/record_official_evidence.py'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/official-content-check.yml'
      - 'horizon_compat/**'
      - 'studio_core/**'
      - 'horizon_cli.py'
      - 'studio.py'
      - 'source_workbench.py'
      - 'voxel_architect.py'
      - 'examples/**'
      - 'tests/fixtures/migration/**'
      - 'scripts/record_official_evidence.py'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  official-content-mod:
    # One leg per audited capability profile (studio_core/engine_profiles.json, HS-008).
    name: Pinned Rust validator against generated example mods${{ matrix.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: d2186eb9aa022a64a8b26e6989a04e44fba99ee7
            suffix: ''
            short: d2186eb
          - sha: 3c1d4b39c6823dca9751118a0b13e6084d019d64
            suffix: ' (profile 3c1d4b3)'
            short: 3c1d4b3
    env:
      HORIZON_SHA: ${{ matrix.sha }}
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Checkout audited Horizon source at immutable revision
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ matrix.sha }}
          path: _horizon_upstream
          persist-credentials: false

      - name: Verify exact checkout revision
        shell: bash
        run: |
          actual="$(git -C _horizon_upstream rev-parse HEAD)"
          test "$actual" = "$HORIZON_SHA" || {
            echo "::error::Unexpected Horizon checkout $actual"
            exit 1
          }
          echo "Pinned upstream checkout: $actual"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust toolchain metadata
        shell: bash
        run: |
          mkdir -p dist/official
          rustc --version | tee dist/official/rustc.txt
          cargo --version | tee dist/official/cargo.txt

      - name: Compile official cargo-horizon-mod from pinned source
        shell: bash
        run: |
          cargo build --manifest-path _horizon_upstream/Cargo.toml --locked --package cargo-horizon-mod
          test -x _horizon_upstream/target/debug/cargo-horizon-mod
          sha256sum _horizon_upstream/target/debug/cargo-horizon-mod | tee dist/official/checker-binary.sha256

      - name: Validate every example project with the genuine official CLI and attest it
        shell: bash
        run: |
          checker="$PWD/_horizon_upstream/target/debug/cargo-horizon-mod"
          # Legacy examples and their studio.project/1 migrations must both pass.
          for project in examples/*.hstudio.json tests/fixtures/migration/*.studio.json; do
            name="$(basename "$project" .json)"
            python horizon_cli.py verify "$project" \
              --direct-validator \
              --validator-bin "$checker" \
              --validator-revision "$HORIZON_SHA" \
              --evidence "dist/official/$name-check.json" \
              --json
            python scripts/record_official_evidence.py \
              --checker "$checker" \
              --checker-revision "$HORIZON_SHA" \
              --official-result "dist/official/$name-check.json" \
              --output "dist/official/$name-attestation.json"
          done

      - name: Upload official checker logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-official-content-check-${{ matrix.short }}
          path: dist/official/
          if-no-files-found: warn
          retention-days: 90
