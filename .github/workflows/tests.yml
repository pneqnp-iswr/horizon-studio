name: CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit, API, launcher and translation tests
        run: python -m unittest discover -s tests -v

  history-js:
    name: Editor modules (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute undo/redo journal and workspace sync tests
        run: node --test tests/test_editor_history.cjs tests/test_editor_workspace.cjs tests/test_editor_model.cjs tests/test_desktop_bridge.cjs tests/test_workbench_ui.cjs tests/test_roadmap_explorer.cjs tests/test_vfx_engine.cjs tests/test_command_palette.cjs

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: node --test --test-reporter=spec tests/e2e/*.e2e.cjs
      - name: Upload failure screenshots, traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failures
          path: test-results/e2e/
          retention-days: 14
          if-no-files-found: ignore
